info:
  name: ヘルスチェック
  type: http
  seq: 1
http:
  method: GET
  url: "{{baseUrl}}/api/health"
runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200と稼働状態を返す", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.deep.equal({ status: "ok" });
        });
        test("ヘルスチェックをキャッシュしない", function () {
          expect(res.getHeader("cache-control")).to.equal("no-store");
        });
settings:
  followRedirects: false
  timeout: 30000
docs: |-
  Workerの応答のみを確認する。D1・Browser Runの稼働確認ではない。
