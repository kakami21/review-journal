info:
  name: 認証付き更新（全件置換・個別実行のみ）
  type: http
  seq: 1
http:
  method: POST
  url: "{{baseUrl}}/api/reviews/refresh"
  auth:
    type: basic
    username: "{{basicAuthUsername}}"
    password: "{{basicAuthPassword}}"
runtime:
  scripts:
    - type: before-request
      code: |-
        // 一括実行からの意図しない全件置換を防ぐ。CLIは明示した単発コマンドでのみ許可する。
        const mode = req.getExecutionMode();
        if (mode !== "standalone" && !(mode === "cli" && bru.getEnvVar("runManualUpdate") === "true")) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("HTTP 200で取得件数と成功日時を返す", function () {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(Number.isInteger(body.count)).to.equal(true);
          expect(body.count).to.be.at.least(0);
          expect(body.scrapedAt).to.be.a("string");
          expect(Number.isNaN(Date.parse(body.scrapedAt))).to.equal(false);
        });
settings:
  followRedirects: false
  timeout: 600000
docs: |-
  現在の更新はBrowser Runで収集後、接続先D1の口コミを全件置換する。
  通常のRunner/CLI一括実行では送信しない。アプリはこのリクエストだけを開いてSendする。
  CLIはこのファイルを指定し、--env-var runManualUpdate=trueを付けたときだけ送信する。
  productionを選択した個別実行は本番データを書き換える。送信前にURLと環境を確認する。
  401は認証失敗、500は収集・保存失敗。成功とみなさず原因を確認する。
