info:
  name: 認証付き更新（D1を全件置換）
  type: http
  seq: 1
http:
  method: POST
  url: "{{baseUrl}}/api/reviews/refresh"
  auth:
    type: basic
    username: "{{basicAuthUsername}}"
    password: "{{basicAuthPassword}}"
runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200で取得件数と成功日時を返す", function () {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(Number.isInteger(body.count)).to.equal(true);
          expect(body.count).to.be.at.least(0);
          expect(body.scrapedAt).to.be.a("string");
          expect(Number.isNaN(Date.parse(body.scrapedAt))).to.equal(false);
        });
settings:
  followRedirects: false
  timeout: 600000
docs: |-
  Browser Runで収集後、接続先D1の口コミを全件置換する。
  通常確認とは別の手動更新専用コレクション。このコレクションの実行はデータ更新を伴う。
  localを選び、このリクエストの送信ボタンで実行する。必要な認証情報はコレクション直下の.envへ設定する。
  productionで実行すると本番データを書き換える。送信前に環境と接続先URLを確認する。
  401は認証失敗、500は収集・保存失敗。成功とみなさず原因を確認する。
