name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

# 公開途中の実行はキャンセルしない。複数タグを同時にpushせず、前回の完了を待つ。
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.created && !github.event.deleted && !github.event.forced
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://pakoirileo.nokishita.app
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: タグ形式・コミット・main履歴を検証
        run: node scripts/release.mjs check-tag "$RELEASE_TAG" "$RELEASE_SHA"
      - run: npm ci
      - name: 同じコミットのCI成果物を取得
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/download-production.sh
      - name: 本番の接続先を検証
        run: node scripts/release.mjs check-production dist/astro-production/server/wrangler.json
      - name: CMSスキーマの適用済み状態を検証
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx emdash migrate --manifest astro/.emdash/migrations.json --wrangler-config wrangler.astro.production.jsonc --check
      - name: 本番へ公開
        id: version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-${{ github.run_id }}-${{ github.run_attempt }}.ndjson
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy --config dist/astro-production/server/wrangler.json \
            --tag "$RELEASE_TAG" --message "Release $RELEASE_TAG ($RELEASE_SHA)"
          jq -ers 'map(select(.type == "deploy")) | select(length == 1) | .[0].version_id | strings | select(test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$")) | "id=\(.)"' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
      - name: 公開後のヘルスチェック
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://pakoirileo.nokishita.app/api/health', {
            headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(30000),
          });
          if (response.status !== 200 || (await response.json()).status !== 'ok') {
            throw new Error('本番のヘルスチェックに失敗しました。');
          }
          const page = await fetch('https://pakoirileo.nokishita.app/', { signal: AbortSignal.timeout(30000) });
          if (!page.ok || !(await page.text()).includes(`name="release-version" content="${process.env.RELEASE_TAG}"`)) {
            throw new Error('公開HTMLのリリースタグが一致しません。');
          }
          JS
      - name: 公開結果を記録
        if: always()
        env:
          WORKER_VERSION: ${{ steps.version.outputs.id }}
          RESULT: ${{ job.status }}
        run: |
          printf '## 本番リリース\n\n- タグ: `%s`\n- コミット: `%s`\n- Worker: dining-archive\n- バージョン: `%s`\n- 結果: %s\n' \
            "$RELEASE_TAG" "$RELEASE_SHA" "$WORKER_VERSION" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
