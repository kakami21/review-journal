name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# 公開途中の実行はキャンセルしない。複数タグを同時にpushせず、前回の完了を待つ。
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.created && !github.event.deleted && !github.event.forced
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://pakoirileo.nokishita.app
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: タグ形式・コミット・main履歴を検証
        run: node scripts/release.mjs check-tag "$RELEASE_TAG" "$RELEASE_SHA"
      - run: npm ci
      - run: npm test
      - run: npm run build:astro
      # 最後に本番用の既存Viteビルドを実行し、検証用の生成設定と混同しない。
      - run: npm run build
      - name: 本番の接続先を検証
        run: node scripts/release.mjs check-production dist/dining_archive/wrangler.json
      - name: 本番へ公開
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy --config dist/dining_archive/wrangler.json \
            --tag "$RELEASE_TAG" --message "Release $RELEASE_TAG ($RELEASE_SHA)" | tee deploy.log
      - name: Workerバージョンを記録
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^Current Version ID: ([0-9a-f-]+).*$/\1/p' deploy.log)
          [[ "$version" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          printf 'id=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: 公開後のヘルスチェック
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://pakoirileo.nokishita.app/api/health', {
            headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(30000),
          });
          if (response.status !== 200 || (await response.json()).status !== 'ok') {
            throw new Error('本番のヘルスチェックに失敗しました。');
          }
          JS
      - name: 公開結果を記録
        if: always()
        env:
          WORKER_VERSION: ${{ steps.version.outputs.id }}
          RESULT: ${{ job.status }}
        run: |
          printf '## 本番リリース\n\n- タグ: `%s`\n- コミット: `%s`\n- Worker: dining-archive\n- バージョン: `%s`\n- 結果: %s\n' \
            "$RELEASE_TAG" "$RELEASE_SHA" "$WORKER_VERSION" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
