name: "作業Issue（単独・子Issue）"
description: "単独で実装・検証・完了できる作業を登録します。"
body:
  - type: markdown
    attributes:
      value: |
        リポジトリの `.github/CONTRIBUTING.md`（Issue運用規則）を確認してください。
        タイトルは `feat` / `fix` / `refactor` / `docs` / `test` / `chore` のいずれかで始め、`feat: 日本語の要約` または `test(integration): 日本語の要約` の形式にしてください。
        通常は優先度ラベルなし。必要な場合のみ `priority:urgent` または `priority:next` を最大1つ付け、理由を本文に記載してください。親子に分ける場合、優先度は子Issueに付けます。
        本番のサービス提供に支障が出た場合だけ `incident` ラベルを追加してください。
  - type: checkboxes
    id: preflight
    attributes:
      label: 登録前の確認
      options:
        - label: 未完了のIssueを検索し、同じ目的のIssueがないことを確認した
          required: true
        - label: 秘密情報・認証ヘッダー・顧客情報を含めていない
          required: true
        - label: 未確認の原因を断定していない
          required: true
  - type: textarea
    id: purpose
    attributes:
      label: "目的"
      description: "解決する課題と、実現したい状態を記載してください。"
      placeholder: "誰の何を改善するか"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "対象環境"
      description: "本番・検証・ローカルの区別と、関係するバージョンや設定を記載してください。秘密情報は含めないでください。"
      placeholder: "環境、対象URL、バージョンなど。未確認の項目は「未確認」"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "再現手順または再現コマンド"
      description: "不具合は再現方法、機能追加・改善は現状の確認方法を記載してください。該当しない場合は理由を記載してください。"
      placeholder: "1. 対象環境で…\n2. …を実行する"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "期待結果"
      description: "本来期待する動作や、作業後に実現する状態を記載してください。"
      placeholder: "…できること"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "実際の結果"
      description: "現在の動作、制約、エラーを記載してください。未実行の場合はその旨を記載してください。"
      placeholder: "現在は…となる"
    validations:
      required: true
  - type: textarea
    id: confirmed
    attributes:
      label: "原因として確認できたこと"
      description: "事実と推測を分け、ログやコードなどの根拠を示してください。原因が不明な場合は「未確認」と記載してください。"
      placeholder: "確認済みの事実：…\n未確認：…"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: "影響範囲・回避手段"
      description: "不具合・障害の場合は必須です。影響する機能・利用者と回避手段の有無を記載し、不明な点は「未確認」としてください。"
      placeholder: "影響する機能・利用者：…\n回避手段：あり／なし／未確認"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "受入条件"
      description: "完了を判断できる条件をチェックリストで記載してください。 該当環境での検証方法も含めてください。"
      placeholder: "- [ ] …\n- [ ] …"
    validations:
      required: true
  - type: textarea
    id: parent
    attributes:
      label: "親Issue・関連Issue"
      description: "子Issueの場合は主な親を1つ選び、登録後にGitHubのSub-issue機能で紐付けてください。他のテーマは参照リンクにします。単独のIssueは記入不要です。"
      placeholder: "親Issue：#…\n関連Issue：#…"
    validations:
      required: false
  - type: textarea
    id: priority
    attributes:
      label: "優先度の理由"
      description: "優先度ラベルを付ける場合は必須です。利用者への影響、期限、他の作業を妨げる事情などを1行で記載してください。種類だけで優先度を決めません。"
      placeholder: "…のため、次に着手する"
    validations:
      required: false
