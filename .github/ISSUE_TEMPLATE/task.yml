name: 作業Issue（単独・子Issue）
description: 単独で実装・検証・完了できる作業
body:
  - type: markdown
    attributes:
      value: リポジトリの `.github/CONTRIBUTING.md` に従って登録する。
  - type: textarea
    id: purpose
    attributes:
      label: 背景・目的
      description: 困っていることと改善したいことを、身近な言葉で2文を目安に書く。
      placeholder: 現在は…のため、…を改善する
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 対応内容
      description: 利用者から見て変わることを3〜5項目を目安に書く。少ない項目でも可。調査の場合は、何を明らかにするかを書く。
      placeholder: "- …できるようにする\n- …の原因を調べる"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 何ができたら終わりかを、確認できる言葉でチェックリストにする。
      placeholder: "- [ ] …できる\n- [ ] …で動作を確認する"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 補足
      description: 必要な技術詳細・関連Issue・優先度の理由を書く。長い説明は別資料へのリンクにする。不具合は環境・再現手順・期待と実際の結果・影響・回避手段を必要に応じて書き、事実と推測を分ける。不要なら省略可。
    validations:
      required: false
