name: 親Issue（テーマ）
description: 複数の作業に分けて進めるテーマ
body:
  - type: markdown
    attributes:
      value: リポジトリの `.github/CONTRIBUTING.md` に従って登録する。
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: 全体で実現したいことと、その理由を、身近な言葉で2文を目安に書く。
      placeholder: …を実現するため、…を整える
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 対象範囲
      description: どこまで対応するかを短く書く。必要なら対象外も書く。子Issueの説明は繰り返さない。
      placeholder: "対象：…\n対象外：…"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 全体として何ができたら終わりかを、確認できる言葉でチェックリストにする。
      placeholder: "- [ ] …が利用できる\n- [ ] …を検証する"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 補足
      description: 子Issueへのリンク、未決定事項、必要な技術詳細を書く。子Issueの説明は繰り返さず、長い説明は別資料へのリンクにする。不要なら省略可。
    validations:
      required: false
